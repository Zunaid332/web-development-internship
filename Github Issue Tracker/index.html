<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issue Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="login-page" class="login-page">
    <div class="login-box">
      <h1>Issue Tracker</h1>
      <p class="login-text">Sign in to continue</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="admin123">
        <p id="login-error" class="login-error"></p>
        <button type="submit" class="btn btn-green full">Sign in</button>
      </form>
      <p class="demo-info">Demo account: admin / admin123</p>
    </div>
  </section>

  <section id="app-page" class="app-page hidden">
    <header class="navbar">
      <h2 class="logo">Issue Tracker</h2>
      <div class="nav-right">
        <input type="text" id="search-input" placeholder="Search issues...">
        <button id="new-issue-btn" class="btn btn-green">New Issue</button>
        <button id="logout-btn" class="btn btn-light">Logout</button>
      </div>
    </header>

    <main class="container">
      <div class="tabs">
        <button class="tab active" data-tab="all">All <span id="all-count">0</span></button>
        <button class="tab" data-tab="open">Open <span id="open-count">0</span></button>
        <button class="tab" data-tab="closed">Closed <span id="closed-count">0</span></button>
      </div>

      <p id="result-text" class="result-text"></p>

      <div id="issue-list" class="issue-list"></div>
    </main>
  </section>

  <div id="details-modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="details-modal">&times;</button>
      <div id="details-content"></div>
    </div>
  </div>

  <div id="create-modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" data-close="create-modal">&times;</button>
      <h3>Create New Issue</h3>
      <form id="create-form">
        <label for="issue-title">Title</label>
        <input type="text" id="issue-title" required>
        <label for="issue-description">Description</label>
        <textarea id="issue-description" rows="4" required></textarea>
        <label for="issue-author">Author</label>
        <input type="text" id="issue-author" required>
        <label for="issue-priority">Priority</label>
        <select id="issue-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <label for="issue-labels">Labels (separate with comma)</label>
        <input type="text" id="issue-labels" placeholder="bug, ui">
        <button type="submit" class="btn btn-green full">Submit Issue</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
